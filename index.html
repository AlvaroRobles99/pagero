    <!--
      The site is live, so every URL that leaves the document is absolute: a
      share card has to resolve the same way from WhatsApp, Facebook or X, where
      a relative path has nothing to resolve against.

      The origin is www on purpose. Vercel answers 200 on
      https://www.sanarseconro.com/ and redirects the apex to it with a 308, so
      a canonical on the apex would name a redirect instead of the page.

      src/tests/seo.test.tsx pins this origin in SITE_ORIGIN, shared with the
      robots.txt and sitemap.xml contract: change it there and all four URLs
      and both crawl files have to move together.
    -->

    <meta name="robots" content="index, follow" />

    <!--
      The brand fonts are self-hosted from /fonts/ and declared in src/index.css.
      Nothing third-party sits on the render path: a Google Fonts <link> is a
      cross-origin stylesheet, so it blocks the first paint of the WHOLE page,
      not just the text, and it costs two DNS/TLS chains before the font file
      is even requested (~780 ms of blocking on Lighthouse's mobile profile).

      Two faces are preloaded because the first screen needs them: the hero h1
      (Cormorant 700) and every line of body copy (Figtree). The italic face is
      one tagline line and is left to load on its own — preloading it would
      compete with the hero photo, which is the LCP element.

      crossorigin is required even same-origin: fonts are always fetched in CORS
      mode, and without it the browser downloads each file twice.
    -->
    <link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/figtree-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      The LCP element is the middle hero photograph, and this is the only way the
      browser can start fetching it: the page is a client-rendered SPA, so the
      <img> does not exist until the module script below is parsed and React
      renders. Without this preload Lighthouse reports "the request can be
      discovered in the initial document" as failed, with every other LCP hint
      already green, because eager + high priority arrive too late.

      Two details break it if they change:
        1. NO crossorigin. An image preload with crossorigin forks the request
           mode, so the <img> afterwards cannot reuse it and the file downloads
           twice. This is the exact opposite of the font preloads above.
        2. The href must match the <img src> byte for byte. src/data/hero.ts is
           the single source of truth for that path, and src/tests/lcp.test.tsx
           fails if this line drifts from the photo marked priority: true.

      The middle frame is the correct target at every viewport: .panelLeft is
      hidden below 900px and .panelRight below 600px, but .panelCenter never is.
    -->
    <link rel="preload" as="image" href="/images/rocio-oraculos.webp" fetchpriority="high" />

    <!--

      publishing nothing. src/tests/seo.test.tsx locks both halves of that

    -->

          },
