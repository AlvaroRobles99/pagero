<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce0ec"/>
      <stop offset="30%" stop-color="#f5b8cc"/>
      <stop offset="60%" stop-color="#e87090"/>
      <stop offset="100%" stop-color="#d45878"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb8c8"/>
      <stop offset="100%" stop-color="#ff7090"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c46078"/>
      <stop offset="30%" stop-color="#a84860"/>
      <stop offset="100%" stop-color="#783048"/>
    </linearGradient>
    <linearGradient id="seaShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e87090" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffb8c8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c46078" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2838"/>
      <stop offset="100%" stop-color="#3d1825"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb8c8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffb8c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="500" fill="url(#sky)"/>

  <!-- Sun glow -->
  <circle cx="600" cy="200" r="240" fill="url(#sunGlow)"/>

  <!-- Sun -->
  <circle cx="600" cy="240" r="52" fill="url(#sun)"/>

  <!-- Mountains background -->
  <polygon points="0,320 150,220 300,300 450,200 600,270 750,180 900,260 1050,210 1200,290 1200,500 0,500" fill="url(#mountains)" opacity="0.5"/>

  <!-- Mountains middle -->
  <polygon points="0,350 200,270 380,310 520,250 680,290 820,240 1000,280 1200,260 1200,500 0,500" fill="url(#mountains)" opacity="0.7"/>

  <!-- Mountains front -->
  <polygon points="0,380 180,320 350,360 500,310 650,340 780,300 950,350 1200,330 1200,500 0,500" fill="#4a1e2e"/>

  <!-- Sea -->
  <rect x="0" y="370" width="1200" height="130" fill="url(#sea)"/>

  <!-- Sea shine -->
  <rect x="0" y="370" width="1200" height="130" fill="url(#seaShine)"/>

  <!-- Waves -->
  <path d="M0,390 Q50,380 100,390 Q150,400 200,390 Q250,380 300,390 Q350,400 400,390 Q450,380 500,390 Q550,400 600,390 Q650,380 700,390 Q750,400 800,390 Q850,380 900,390 Q950,400 1000,390 Q1050,380 1100,390 Q1150,400 1200,390 L1200,500 L0,500 Z" fill="#783048" opacity="0.5"/>
  <path d="M0,410 Q60,400 120,410 Q180,420 240,410 Q300,400 360,410 Q420,420 480,410 Q540,400 600,410 Q660,420 720,410 Q780,400 840,410 Q900,420 960,410 Q1020,400 1080,410 Q1140,420 1200,410 L1200,500 L0,500 Z" fill="#5c2838" opacity="0.4"/>

  <!-- Birds -->
  <path d="M300,160 Q310,150 320,160" fill="none" stroke="#c44060" stroke-width="2" opacity="0.6"/>
  <path d="M330,140 Q340,130 350,140" fill="none" stroke="#c44060" stroke-width="2" opacity="0.5"/>
  <path d="M280,175 Q290,165 300,175" fill="none" stroke="#c44060" stroke-width="1.5" opacity="0.4"/>

  <!-- Lotus / spiritual symbol -->
  <g transform="translate(150, 280)" opacity="0.2">
    <ellipse cx="0" cy="-15" rx="12" ry="20" fill="#e87090"/>
    <ellipse cx="-10" cy="-10" rx="10" ry="18" fill="#e87090" transform="rotate(-20)"/>
    <ellipse cx="10" cy="-10" rx="10" ry="18" fill="#e87090" transform="rotate(20)"/>
    <ellipse cx="-15" cy="0" rx="8" ry="14" fill="#d45878" transform="rotate(-40)"/>
    <ellipse cx="15" cy="0" rx="8" ry="14" fill="#d45878" transform="rotate(40)"/>
  </g>

  <!-- Moon / circle spiritual symbol -->
  <circle cx="980" cy="170" r="25" fill="none" stroke="#e87090" stroke-width="1.5" opacity="0.3"/>
  <circle cx="980" cy="170" r="15" fill="none" stroke="#e87090" stroke-width="1" opacity="0.2"/>

  <!-- Stars / sparkles -->
  <circle cx="200" cy="100" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="450" cy="80" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="750" cy="90" r="2" fill="#fff" opacity="0.4"/>
  <circle cx="1000" cy="110" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="150" cy="140" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="850" cy="60" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="550" cy="70" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="680" cy="120" r="1" fill="#fff" opacity="0.5"/>

  <!-- Mandala / circular pattern -->
  <g transform="translate(1050, 300)" opacity="0.12">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#e87090" stroke-width="1"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#e87090" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#e87090" stroke-width="0.6"/>
    <circle cx="0" cy="0" r="6" fill="none" stroke="#e87090" stroke-width="0.5"/>
  </g>
</svg>
